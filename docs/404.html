<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Moved to ArchiveBase — IIIF Curation Search & Comparison</title>
    <link rel="canonical" href="https://archivebase.ldas.jp/tools/icc" />
    <script>
      // This tool (旧 ICC / ICC2) has moved into ArchiveBase as the
      // /tools/icc tool. Preserve the shared IIIF resource across the old URL
      // shapes: ?u= / ?curation= / ?manifest= / ?collection=, in the query OR
      // in a hash-routed fragment (old icc v1: `#/?curation=…`).
      (function () {
        var INDEX = 'https://archivebase.ldas.jp/tools/icc'
        var SEARCH = INDEX + '/search'
        function pick(p) {
          return (
            p.get('u') || p.get('curation') || p.get('manifest') || p.get('collection') || ''
          )
        }
        var u = pick(new URLSearchParams(location.search))
        if (!u && location.hash.indexOf('?') >= 0) {
          u = pick(new URLSearchParams(location.hash.slice(location.hash.indexOf('?') + 1)))
        }
        // With a resource → open it in the search view; otherwise the index.
        location.replace(u ? SEARCH + '?u=' + encodeURIComponent(u) : INDEX)
      })()
    </script>
    <meta http-equiv="refresh" content="3;url=https://archivebase.ldas.jp/tools/icc" />
    <style>
      body {
        font-family: system-ui, sans-serif;
        max-width: 32rem;
        margin: 4rem auto;
        padding: 0 1rem;
        line-height: 1.6;
        color: #222;
      }
      a {
        color: #2563eb;
      }
    </style>
  </head>
  <body>
    <h1>このツールは移転しました</h1>
    <p>
      IIIF Curation Comparison（旧 ICC / ICC2）は ArchiveBase の
      <a href="https://archivebase.ldas.jp/tools/icc">ツール /tools/icc</a>
      に統合されました。自動的に転送します…
    </p>
    <p style="color: #666; font-size: 0.9rem">
      This tool has moved to
      <a href="https://archivebase.ldas.jp/tools/icc">archivebase.ldas.jp/tools/icc</a>. Your
      shared IIIF resource URL is preserved.
    </p>
  </body>
</html>
